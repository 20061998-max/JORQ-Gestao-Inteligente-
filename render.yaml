services:
  - type: web
    name: jorq-gestao-inteligente
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: npm install --include=dev --legacy-peer-deps && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.20.0
      - key: MP_ENVIRONMENT
        value: sandbox
      - key: APP_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
      - key: VITE_FIREBASE_APP_CHECK_SITE_KEY
        sync: false
